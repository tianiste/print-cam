name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: print_cam
          POSTGRES_PASSWORD: print_cam
          POSTGRES_DB: print_cam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U print_cam -d print_cam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run backend tests
        run: GOCACHE=/tmp/print-cam-gocache go test ./...
        env:
          TEST_DATABASE_URL: postgres://print_cam:print_cam@localhost:5432/print_cam_test?sslmode=disable

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Run browser smoke tests
        run: npm run smoke
        working-directory: frontend

      - name: Build container image
        run: docker build -t print-cam:ci .
